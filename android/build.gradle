// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// @capacitor/local-notifications (issue #16) requires a Java 21 toolchain (kotlin { jvmToolchain(21) }), missing on the PC:
// only Android Studio's JDK 25 is installed. This call is ignored (the plugin is compiled by Gradle's JDK)
// and Java 21 bytecode is kept: sourceCompatibility 21 on the Java side, jvmTarget 21 on the Kotlin side.
subprojects {
    plugins.withId('org.jetbrains.kotlin.android') {
        kotlin.metaClass.jvmToolchain = { int version -> }
        afterEvaluate {
            // Kotlin classes loaded from the plugin: they are not on this file's classpath
            def jvm21 = buildscript.classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget').fromTarget('21')
            tasks.matching { it.class.name.startsWith('org.jetbrains.kotlin.gradle.tasks.KotlinCompile') }.configureEach {
                it.compilerOptions.jvmTarget.set(jvm21)
            }
        }
    }
}
